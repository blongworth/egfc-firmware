# EGFC runtime config example. Copy to the SD card root as egfc.cfg.
# Lines are KEY=VALUE. Blank lines and lines starting with # are ignored.

AUTOSTART_ON_BOOT=true
PUMP_ON_AT_STARTUP=true
RGA_MASSES=2,15,16,18,28,30,32,33,34,40,44
RGA_READY_BEFORE_ACQUISITION_MS=300000
TURBO_READY_BEFORE_RGA_MS=300000
CHAMBER_VALVE_TOGGLE_INTERVAL_MS=20000
MIN_EXPERIMENT_INTERVAL_MS=30000
MAX_EXPERIMENT_INTERVAL_MS=60000
OXYGEN_MIN_MG_L=2.0
OXYGEN_MAX_MG_L=12.0
