; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41_ethernet

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 9600
build_flags = -D USB_MTPDISK_SERIAL
lib_deps = https://github.com/KurtE/MTP_Teensy.git#13ae26f39f6d9f3b690950dfb96ed0f79ee436d1

[env:teensy41_ethernet]
extends = env:teensy41
build_flags = ${env:teensy41.build_flags} -D USE_ETHERNET
